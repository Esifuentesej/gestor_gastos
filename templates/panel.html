<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Gastos</title>
</head>
<body>
    <h2>Mis Gastos</h2>
    <a href="/logout">Cerrar Sesion</a> | <a href="/reporte/json" target="_blank">Ver Reporte JSON</a>
    <hr>
    
    <h3>Registrar Gasto</h3>
    <form action="/registrar" method="POST">
        <label>Fecha: </label>
        <input type="date" name="fecha" required><br><br>
        <label>Descripcion: </label>
        <input type="text" name="descripcion" required><br><br>
        <label>Monto (S/.): </label>
        <input type="number" step="0.01" name="monto" required><br><br>
        <button type="submit">Guardar Registro</button>
    </form>
    
    <hr>
    <h3>Historial</h3>
    <table border="1">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Descripcion</th>
                <th>Monto</th>
            </tr>
        </thead>
        <tbody>
            {% for g in gastos %}
            <tr>
                <td>{{ g.fecha }}</td>
                <td>{{ g.descripcion }}</td>
                <td>S/. {{ g.monto }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
